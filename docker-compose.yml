# Chạy toàn bộ BrewLite ở máy local: docker compose up --build
# Web: http://localhost:3000 · API: http://localhost:3001 (health: /health) · PostgreSQL: localhost:5432
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    ports: ["5432:5432"]
    volumes: ["brewlite-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-brewlite}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-brewlite}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SEED: "true"
      LOG_FORMAT: text
    ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  brewlite-db:
